<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card1{
            border: 2px solid black;
            width: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 20px;
            align-items: center;
        }
        #kitoblar{
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <h1>Massivdan kitob kartalari</h1>
    <h3>2. Kartalar</h3>
    <div id="kitoblar">
        
    </div>

    <script>
        let mahsulotlar=[
            {nomi:"O'tkan kunlar" , yozuvchisi: "Abdulla Qodiriy", narxi: "45000 so'm"},           
            {nomi:"Mehrobdan Chayon" , yozuvchisi: "Abdulla Qodiriy", narxi: "38000 so'm"},
            {nomi:"Shum Bola" , yozuvchisi: "G'afur G'ulom", narxi: "60000 so'm"},
            {nomi:"Sariq devni minib" , yozuvchisi: "Xudoyberdi To'xtaboyev", narxi: "30000 so'm"},
            {nomi:"Ikki eshik orasi" , yozuvchisi: "O'tkir Hoshimov", narxi: "52000 so'm"},
            {nomi:"Fotima va Zuhra" , yozuvchisi: "O'lmas Umarbekov", narxi: "80000 so'm"}
        ]
        let html="";
        for(let kitoblar of mahsulotlar){
            html = html+
            `
             <div class="card1">
                <h3>${kitoblar.nomi}</h3>
                <p>${kitoblar.yozuvchisi}</p>
                <p>${kitoblar.narxi}</p>
            </div>
            `
        }
        document.getElementById("kitoblar").innerHTML=html
    </script>
</body>
</html>
