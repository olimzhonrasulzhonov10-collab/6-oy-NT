<DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Mevalar do'koni</title>
  <style>
    .card { border: 1px solid #ccc; padding: 10px; margin: 10px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1 id="shop-title">Mevalar do'koni</h1>

  <div id="shop">
    <div class="card" id="card1">
      <h3>Olma</h3>
      <p class="price">5000</p>
      <span class="stock">Bor</span>
    </div>
    <div class="card" id="card2">
      <h3>Banan</h3>
      <p class="price">12000</p>
      <span class="stock">Bor</span>
    </div>
    <div class="card" id="card3">
      <h3>Uzum</h3>
      <p class="price">20000</p>
      <span class="stock">Tugagan</span>
    </div>
    <div class="card" id="card4">
      <h3>Anor</h3>
      <p class="price">15000</p>
      <span class="stock">Bor</span>
    </div>
  </div>

  <script>
    document.getElementById("shop-title").textContent="Yangi mevalar do'koni"
    const SarlavhaRang=document.querySelector("#shop-title");
    SarlavhaRang.style.color="green"

    const hammaCard=document.querySelectorAll(".card");
    hammaCard.forEach(hammaCard=>{
        hammaCard.style.borderRadius="10px";
    });

    let card=document.querySelector("#card1");
    card.classList.add("sale");
    console.log(card)

    let card3=document.querySelector("#card3");
    card3.classList.add("sold-out");
    console.log(card3);

    const shriftQalin=document.querySelectorAll(".price");
    shriftQalin.forEach(shriftQalin=>{
        shriftQalin.style.fontWeight="bold";
    });
  </script>
</body>
</html>
